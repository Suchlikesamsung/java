spring:
  application:
    name: api

  profiles:
    default: local

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080

app:
  jwt:
    secret: local-development-jwt-secret-key-must-be-at-least-32-bytes
    access-expiration-milliseconds: 1800000      # 30분
    refresh-expiration-milliseconds: 1209600000  # 14일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
